<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Administrador · Agente 360</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#f3f4f7; --card:#fff; --ink:#151a24; --muted:#5f6878; --line:#e0e4ea;
    --brand:#3a3fd6; --brand-soft:#ecedfd; --ok:#12805c; --ok-soft:#dcf3e9; --bad:#b4372f; --bad-soft:#fbe5e3; --warn:#9a6a00; --warn-soft:#fdf1d6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
  header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
  .bar{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
  .bar h1{font-size:16px;margin:0;flex:1}
  .bar small{display:block;color:#aab1c0;font-weight:500}
  main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
  .tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto}
  .tab{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:999px;cursor:pointer;font:inherit;font-weight:600;color:var(--muted);white-space:nowrap}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .tab .n{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;margin-left:6px;font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .card h2{font-size:17px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 14px}
  label{display:block;font-weight:600;margin:12px 0 5px;font-size:13.5px}
  input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  textarea{min-height:80px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:transparent}
  .btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:9px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:wait}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi b{display:block;font-size:22px}
  .kpi span{color:var(--muted);font-size:12.5px}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eef0f4;color:var(--muted)}
  .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.brand{background:var(--brand-soft);color:var(--brand)}
  .cli{display:grid;grid-template-columns:1.6fr 1fr 1.3fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .cli:first-of-type{border-top:0}
  .cli .name b{display:block}
  .cli .name small{color:var(--muted)}
  @media(max-width:760px){.cli{grid-template-columns:1fr 1fr}.cli .acts{grid-column:1/-1}}
  .meter{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden;margin:4px 0 2px}
  .meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
  .meter i.warn{background:#e0a100} .meter i.bad{background:var(--bad)}
  .small{font-size:12.5px;color:var(--muted)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
  .chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
  .chk input{width:auto;accent-color:var(--brand)}
  .note{padding:11px 13px;border-radius:9px;background:var(--brand-soft);color:#272b8f;margin-top:10px}
  .note.bad{background:var(--bad-soft);color:var(--bad)} .note.warn{background:var(--warn-soft);color:#6b4a00} .note.ok{background:var(--ok-soft);color:var(--ok)}
  .hidden{display:none!important}
  .login{max-width:400px;margin:8vh auto}
  dialog{border:0;border-radius:14px;padding:0;width:min(640px,94vw);max-height:90vh;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(15,18,30,.5)}
  .dlg{padding:18px;overflow:auto;max-height:90vh}
  .dlg h3{margin:0 0 4px}
  .dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  pre.p{white-space:pre-wrap;background:#f7f8fa;border:1px solid var(--line);border-radius:9px;padding:10px;font:12.5px/1.5 ui-monospace,monospace;max-height:220px;overflow:auto}
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
  .legend code{background:#eef0f4;border-radius:5px;padding:1px 5px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:50}
</style>
</head>
<body>
<header id="hdr" class="hidden"><div class="bar"><h1>Panel Administrador<small>Agente IA 360</small></h1><button class="btn ghost sm" id="bOut">Salir</button></div></header>

<section id="vLogin" class="login card">
  <h2>Panel del administrador</h2>
  <p class="sub">Solo para el dueño del servicio.</p>
  <form id="fLogin">
    <label for="em">Correo</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required>
    <div style="margin-top:16px"><button class="btn" id="bIn">Entrar</button></div>
    <div id="lMsg" class="note bad hidden"></div>
  </form>
</section>

<main id="vApp" class="hidden">
  <nav class="tabs">
    <button class="tab on" data-t="cli">👥 Clientes</button>
    <button class="tab" data-t="con">📱 Conexiones<span class="n hidden" id="nCon"></span></button>
    <button class="tab" data-t="frm">📝 Formularios<span class="n hidden" id="nFrm"></span></button>
    <button class="tab" data-t="pla">💳 Planes</button>
    <button class="tab" data-t="aju">⚙️ Tarifas y condiciones</button>
  </nav>
  <section id="tcli"></section>
  <section id="tcon" class="hidden"></section>
  <section id="tfrm" class="hidden"></section>
  <section id="tpla" class="hidden"></section>
  <section id="taju" class="hidden"></section>
</main>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
const CFG = window.PORTAL_CONFIG || {};
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show = (el, on) => el.classList.toggle('hidden', !on);
const money = (n) => n == null || n === '' ? '—' : '$' + Number(n).toLocaleString('es-VE', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const fdate = (d) => d ? d.split('-').reverse().join('/') : '—';
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
async function rpc(fn, args){ const { data, error } = await sb.rpc(fn, args || {}); if (error) { toast('Error: ' + error.message); throw error; } return data; }

const FUNC = {
  citas:'📅 Agendar citas', reservas:'🛏️ Reservas', pedidos:'🛒 Ventas y pedidos', delivery:'🛵 Envíos o delivery',
  cotizaciones:'🧾 Cotizaciones', membresias:'🎟️ Planes o membresías', tasas:'💱 Tasas del día', paquetes:'✈️ Paquetes y viajes',
  soporte:'🛠️ Soporte técnico', promociones:'🎁 Promociones', fotos:'📷 Fotos de productos', recordatorios:'⏰ Recordatorio de citas',
  conversaciones:'💬 Ver conversaciones', crm:'📈 Clientes potenciales y métricas', masivos:'📣 Mensajes masivos'
};
const GRUPOS = [['Lo que hace el bot', ['citas','reservas','pedidos','delivery','cotizaciones','membresias','tasas','paquetes','soporte']],
                ['Herramientas del portal', ['promociones','fotos','recordatorios','conversaciones','crm','masivos']]];
const ESTADO = { prueba:['warn','En prueba'], activa:['ok','Activa'], suspendida:['bad','Suspendida'] };
const MOTIVO = { limite:'Llegó al límite', vencido:'Plan vencido', prueba_terminada:'Prueba terminada', suspendida:'Suspendida' };
let D = null;

// ---------- Sesión ----------
$('fLogin').onsubmit = async (e) => {
  e.preventDefault(); $('bIn').disabled = true; show($('lMsg'), false);
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  $('bIn').disabled = false;
  if (error) { $('lMsg').textContent = 'Correo o contraseña incorrectos.'; show($('lMsg'), true); } else start();
};
$('bOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };
async function start(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show($('vLogin'), true); return; }
  const ok = await rpc('es_super_admin').catch(() => false);
  if (!ok) { show($('vLogin'), true); $('lMsg').textContent = 'Esta cuenta no es de administrador.'; show($('lMsg'), true); await sb.auth.signOut(); return; }
  show($('vLogin'), false); show($('hdr'), true); show($('vApp'), true);
  await load();
}
async function load(){ D = await rpc('admin_datos'); rCli(); rFrm(); rPla(); rAju(); loadCon(); }

// ---------- Conexiones (estado del WhatsApp de cada cliente) ----------
let C2 = null;
async function loadCon(){ C2 = await rpc('admin_conexiones').catch(() => null); if (C2) rCon(); }
function hace(ts){ if (!ts) return '—'; const m = Math.round((Date.now() - new Date(ts)) / 60000);
  return m < 1 ? 'hace un momento' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} día(s)`; }
function rCon(){
  const k = C2.kpis, I = C2.instancias;
  $('nCon').textContent = k.caidas; show($('nCon'), k.caidas > 0);
  const EST = { conectada:['ok','🟢 Conectado'], desconectada:['bad','🔴 Desconectado'], esperando_qr:['warn','🟡 Esperando QR'] };
  $('tcon').innerHTML = `
    <div class="kpis">
      <div class="kpi"><b style="color:var(--ok)">${k.conectadas}</b><span>WhatsApp conectados</span></div>
      <div class="kpi"><b style="color:var(--bad)">${k.caidas}</b><span>Desconectados</span></div>
      <div class="kpi"><b style="color:var(--warn)">${k.esperando_qr}</b><span>Esperando QR</span></div>
      <div class="kpi"><b>${k.clientes_activos}</b><span>Clientes activos</span></div>
      <div class="kpi"><b>${k.conversaciones_totales}</b><span>Conversaciones totales · ${k.conversaciones_hoy} hoy</span></div>
    </div>
    <div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
      <div><h2>Estado de las conexiones</h2><p class="sub" style="margin:0">Primero los que tienen problemas. Se actualiza solo cuando WhatsApp avisa un cambio; pulsa "Comprobar ahora" para consultar a Evolution en este momento.</p></div>
      <button class="btn" id="bLive">🔄 Comprobar ahora</button></div>
      <div style="overflow:auto;margin-top:12px"><table class="t"><tr><th>Negocio</th><th>Estado</th><th>Instancia</th><th>Número</th><th>Último cambio</th><th>Último mensaje</th><th>Plan</th></tr>
      ${I.map(x => { const [c, t] = EST[x.estado] || ['', x.estado];
        return `<tr><td><b>${esc(x.negocio)}</b>${x.activo ? '' : ' <span class="pill bad">Inactivo</span>'}</td><td><span class="pill ${c}">${t}</span></td>
          <td>${esc(x.instancia)}</td><td>${x.numero ? '+' + esc(x.numero) : '—'}</td><td>${hace(x.actualizado)}</td><td>${hace(x.ultimo_mensaje)}</td><td>${esc(x.plan || '')}</td></tr>`; }).join('') || '<tr><td colspan="7">No hay instancias registradas.</td></tr>'}
      </table></div>
      ${k.caidas ? '<div class="note bad">🔴 Los clientes desconectados deben entrar a su portal → "Mi WhatsApp" → "Mostrar código QR" y escanearlo. Mientras tanto su asistente no responde.</div>' : ''}
    </div>`;
  $('bLive').onclick = async () => {
    $('bLive').disabled = true; $('bLive').textContent = 'Consultando…';
    try {
      const { data: { session } } = await sb.auth.getSession();
      const r = await fetch(CFG.N8N_URL + '/webhook/admin-conexiones', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: session.access_token, anon_key: CFG.SUPABASE_ANON_KEY }) }).then(x => x.json());
      toast(r.ok ? `Listo: ${r.actualizadas} conexión(es) comprobada(s)` : (r.mensaje || 'No se pudo comprobar'));
    } catch { toast('No se pudo comprobar. Intenta de nuevo.'); }
    await loadCon(); D = await rpc('admin_datos'); rCli();
  };
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  for (const t of ['cli','con','frm','pla','aju']) show($('t' + t), b.dataset.t === t);
});
function openDlg(html){ $('dlgBody').innerHTML = html; $('dlg').showModal(); }
function closeDlg(){ $('dlg').close(); }

// ---------- Clientes ----------
function rCli(){
  const c = D.clientes, plan = Object.fromEntries(D.planes.map(p => [p.id, p]));
  const act = c.filter(x => x.estado_cuenta === 'activa' && x.activo);
  const ingreso = act.reduce((s, x) => s + Number((plan[x.plan] || {}).precio_mensual || 0), 0);
  const extra = c.reduce((s, x) => s + Number(x.extra_pendiente || 0), 0);
  $('tcli').innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${act.length}</b><span>Clientes activos</span></div>
      <div class="kpi"><b>${c.filter(x => x.estado_cuenta === 'prueba').length}</b><span>En prueba</span></div>
      <div class="kpi"><b>${c.filter(x => !x.puede_responder).length}</b><span>Con el bot detenido</span></div>
      <div class="kpi"><b>${money(ingreso)}</b><span>Ingreso mensual (planes activos)</span></div>
      <div class="kpi"><b>${money(extra)}</b><span>Respuestas extra por cobrar</span></div>
    </div>
    <div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
      <div><h2>Clientes</h2><p class="sub" style="margin:0">${c.length} en total</p></div>
      <div style="display:flex;gap:8px"><input id="qCli" placeholder="🔎 Buscar…" style="width:200px"><button class="btn" id="bNew">+ Nuevo cliente</button></div></div>
      <div id="lCli" style="margin-top:10px"></div></div>`;
  const paint = () => {
    const q = $('qCli').value.toLowerCase();
    $('lCli').innerHTML = c.filter(x => !q || (x.negocio + ' ' + (x.email || '')).toLowerCase().includes(q)).map(x => {
      const [ek, et] = ESTADO[x.estado_cuenta] || ['', x.estado_cuenta];
      const pct = Math.min(100, x.porcentaje || 0), cls = pct >= 100 ? 'bad' : pct >= 80 ? 'warn' : '';
      const dv = x.dias_para_vencer;
      return `<div class="cli">
        <div class="name"><b>${esc(x.negocio)}</b><small>${esc(x.email || 'sin correo')} · ${esc(x.categoria || '')}</small><br>
          <span class="pill brand">${esc(x.plan_nombre || x.plan)}</span> <span class="pill ${ek}">${et}</span>
          ${x.whatsapp ? `<span class="pill ${x.whatsapp === 'conectada' ? 'ok' : 'bad'}">WhatsApp ${x.whatsapp === 'conectada' ? 'conectado' : 'desconectado'}</span>` : '<span class="pill">Sin WhatsApp</span>'}
          ${x.formulario === 'pendiente_revision' ? '<span class="pill warn">Formulario por revisar</span>' : ''}</div>
        <div><div class="small">Vence: <b>${fdate(x.vence)}</b></div>
          <div class="small">${dv == null ? '' : dv < 0 ? `<span style="color:var(--bad)">Venció hace ${-dv} día(s)${x.en_gracia ? ' · en gracia' : ''}</span>` : `Faltan ${dv} día(s)`}</div>
          ${!x.puede_responder ? `<span class="pill bad">Bot detenido: ${MOTIVO[x.motivo] || x.motivo}</span>` : ''}</div>
        <div><div class="small">${(x.usadas || 0).toLocaleString('es')} de ${(x.limite || 0).toLocaleString('es')} respuestas ${x.extra ? `· <b>${x.extra} extra este mes</b>` : ''}</div>
          <div class="meter"><i class="${cls}" style="width:${pct}%"></i></div>
          ${Number(x.extra_pendiente) > 0 ? `<div class="small" style="color:var(--bad)">Extra por cobrar: <b>${money(x.extra_pendiente)}</b></div>` : ''}
          <div class="small">${x.autoriza_extra ? '✅ Autorizó extra' + (x.extra_tope ? ' (tope ' + x.extra_tope + ')' : '') : 'Sin autorizar extra'}</div></div>
        <div class="acts"><button class="btn sm ok" data-pay="${x.id}">💵 Pago</button><button class="btn sm ghost" data-edit="${x.id}">Editar</button><button class="btn sm ghost" data-hist="${x.id}">Pagos</button><button class="btn sm ghost" data-seg="${x.id}">🔁 Seguimiento</button><button class="btn sm" data-cfg="${x.id}">⚙️ Configurar</button><button class="btn sm ghost" data-key="${x.id}">🔑 Clave</button><button class="btn sm ghost" data-pru="${x.id}">📱 PRUEBAS</button></div>
      </div>`; }).join('') || '<p class="sub">No hay clientes.</p>';
    $('lCli').querySelectorAll('[data-pay]').forEach(b => b.onclick = () => dPago(c.find(x => x.id === b.dataset.pay)));
    $('lCli').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => dEditar(c.find(x => x.id === b.dataset.edit)));
    $('lCli').querySelectorAll('[data-hist]').forEach(b => b.onclick = () => dHist(c.find(x => x.id === b.dataset.hist)));
    $('lCli').querySelectorAll('[data-seg]').forEach(b => b.onclick = () => dSeg(c.find(x => x.id === b.dataset.seg)));
    $('lCli').querySelectorAll('[data-cfg]').forEach(b => b.onclick = async () => { if (await rpc('admin_configurar', { p_tenant: b.dataset.cfg }).catch(() => null)) location.href = 'index.html'; });
    $('lCli').querySelectorAll('[data-key]').forEach(b => b.onclick = () => dClave(c.find(x => x.id === b.dataset.key)));
    $('lCli').querySelectorAll('[data-pru]').forEach(b => b.onclick = () => dPruebas(c.find(x => x.id === b.dataset.pru)));
  };
  $('qCli').oninput = paint; $('bNew').onclick = dNuevo; paint();
}
function dClave(x){
  openDlg(`<h3>🔑 Contraseña del portal</h3><p class="sub">${esc(x.negocio)} · ${esc(x.email || 'sin correo')}</p>
    <label>Nueva contraseña (mín. 6)</label><input id="kC" type="text" autocomplete="new-password">
    <div class="note">Si el cliente aún no tiene acceso, se crea con su correo.</div>
    <div class="foot"><button class="btn ghost" onclick="closeDlg()">Cancelar</button><button class="btn" id="kOk">Guardar</button></div>`);
  $('kOk').onclick = async () => { const r = await rpc('admin_clave_cliente', { p_tenant: x.id, p_clave: $('kC').value }).catch(() => null);
    if (r) { closeDlg(); toast((r.creado ? 'Acceso creado: ' : 'Contraseña cambiada: ') + r.email); } };
}
function dPruebas(x){
  openDlg(`<h3>📱 WhatsApp de pruebas</h3><p class="sub">El número de pruebas (instancia <b>PRUEBAS</b>) pasará a atender como <b>${esc(x.negocio)}</b>. El negocio que lo tenía deja de responder por ese número hasta que se lo devuelvas con este mismo botón.</p>
    <div class="foot"><button class="btn ghost" onclick="closeDlg()">Cancelar</button><button class="btn" id="pOk">Prestar el WhatsApp</button></div>`);
  $('pOk').onclick = async () => { const r = await rpc('admin_mover_instancia', { p_instancia: 'PRUEBAS', p_tenant: x.id }).catch(() => null);
    if (r) { closeDlg(); toast('WhatsApp PRUEBAS: de ' + r.antes + ' → ' + r.ahora); load(); } };
}
const planOpts = (sel) => D.planes.map(p => `<option value="${esc(p.id)}" ${p.id === sel ? 'selected' : ''}>${esc(p.nombre)} — ${money(p.precio_mensual)}/mes</option>`).join('');

function dPago(x){
  const p = D.planes.find(y => y.id === x.plan) || {};
  openDlg(`<h3>💵 Registrar pago</h3><p class="sub">${esc(x.negocio)} · Plan ${esc(p.nombre || x.plan)} · vence ${fdate(x.vence)}</p>
    <div class="row">
      <div><label>Concepto</label><select id="pC">
        <option value="mensualidad">Mensualidad (${money(p.precio_mensual)})</option><option value="anual">Pago anual (${money(p.precio_anual)})</option>

async function dSeg(x){
  const cfg = await rpc('admin_seguimiento', { p_tenant: x.id }).catch(() => null);
  if (cfg === null) return;
  const mins = Array.isArray(cfg.minutos) && cfg.minutos.length ? cfg.minutos.map(Number)
             : (Array.isArray(cfg.horas) && cfg.horas.length ? cfg.horas.map(h => Number(h) * 60) : [1440, 4320]);
  const fmt = (m) => m < 60 ? m + ' min' : m % 1440 === 0 ? (m / 1440) + ' día(s)' : m % 60 === 0 ? (m / 60) + ' h' : m + ' min';
  openDlg(`<h3>🔁 Seguimiento automático</h3><p class="sub">${esc(x.negocio)}</p>
    <div class="chks"><label class="chk"><input type="checkbox" id="sA" ${cfg.activo !== false ? 'checked' : ''}> Activado</label>
      <label class="chk"><input type="checkbox" id="sP" ${cfg.promo !== false ? 'checked' : ''}> Ofrecer promoción desde el 2.º intento</label>
      <label class="chk"><input type="checkbox" id="sH" ${cfg.ignorar_horario ? 'checked' : ''}> Ignorar horario de atención (pruebas)</label></div>
    <div class="row" style="margin-top:12px"><div><label>Cantidad de intentos</label><select id="sN">${[1,2,3,4,5].map(n => `<option ${n === mins.length ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
    <div id="sT" class="row"></div>
    <p class="small">⏱️ Cada tiempo se cuenta en <b>minutos desde el último mensaje del cliente</b> (1440 = 24 h; 4320 = 3 días). Para probar usa, por ejemplo, 2 y 5. El sistema revisa cada 5 minutos, así que puede tardar hasta 5 min más. Si el cliente guarda su seguimiento en su portal, vuelve a sus horas.</p>
    <div class="foot"><button class="btn ghost" onclick="closeDlg()">Cancelar</button><button class="btn" id="sOk">Guardar</button></div>`);
  const paintT = () => { const n = +$('sN').value, cur = [...document.querySelectorAll('#sT input')].map(i => +i.value);
    $('sT').innerHTML = Array.from({ length: n }, (_, i) => { const v = cur[i] || mins[i] || (i ? (cur[i - 1] || mins[i - 1] || 60) * 2 : 1440);
      return `<div><label>Intento ${i + 1} (minutos)</label><input type="number" min="1" max="14400" value="${v}"><span class="small">${fmt(v)}</span></div>`; }).join('');
    $('sT').querySelectorAll('input').forEach(i => i.oninput = () => { i.nextElementSibling.textContent = i.value ? fmt(+i.value) : ''; }); };
  $('sN').onchange = paintT; paintT();
  $('sOk').onclick = async () => {
    const m = [...document.querySelectorAll('#sT input')].map(i => parseInt(i.value, 10));
    if (m.some(v => !(v >= 1 && v <= 14400))) return toast('Cada tiempo debe estar entre 1 y 14400 minutos');
    for (let i = 1; i < m.length; i++) if (m[i] <= m[i - 1]) return toast('Cada intento debe ir después del anterior');
    const r = await rpc('admin_config_seguimiento', { p_tenant: x.id, p_activo: $('sA').checked, p_minutos: m, p_promo: $('sP').checked, p_ignorar_horario: $('sH').checked }).catch(() => null);
    if (!r) return; if (!r.ok) return toast(r.mensaje || 'No se pudo guardar');
    closeDlg(); toast('Seguimiento guardado: ' + m.map(fmt).join(' → '));
  };
}

}

      ${li('Funciones', (r.funciones || []).map(k => FUNC[k] || k).join(', '))}${li('A qué se dedica', r.descripcion)}${li('Dirección', r.direccion)}

      ${li('Respuestas', (r.info_extra || []).map(x => x.pregunta + ' → ' + x.respuesta).join(' | '))}

      ${li('Bienvenida', r.mensaje_bienvenida)}</table>
    <label>Instrucciones redactadas por la IA (puedes corregirlas antes de aprobar)</label>
    <textarea id="fP" style="min-height:200px">${esc(f.prompt || '')}</textarea>

    <div class="foot"><button class="btn ghost" onclick="closeDlg()">Cerrar</button><button class="btn bad" id="fNo">Rechazar</button><button class="btn ok" id="fSi" ${f.estado === 'pendiente_revision' ? '' : 'disabled'}>✅ Aprobar</button></div>`);
  $('fSi').onclick = async () => { const r2 = await rpc('admin_aprobar_formulario', { p_form: id, p_prompt: $('fP').value }).catch(() => null); if (r2) { closeDlg(); toast('Aprobado: el bot ya usa esta configuración'); load(); } };
  $('fNo').onclick = async () => { if (!$('fC').value.trim()) return toast('Escribe qué debe corregir'); const r2 = await rpc('admin_rechazar_formulario', { p_form: id, p_comentario: $('fC').value.trim() }).catch(() => null); if (r2) { closeDlg(); toast('Rechazado. El cliente verá tu comentario.'); load(); } };

// ---------- Planes ----------
function rPla(){
  $('tpla').innerHTML = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div><h2>Planes</h2><p class="sub" style="margin:0">Cambia precios, límites y funciones cuando quieras. Se aplica de inmediato a todos los clientes de ese plan.</p></div>

    ${D.planes.map((p, i) => planCard(p, i)).join('')}`;
  $('bPNew').onclick = () => { D.planes.push({ id:'', nombre:'', precio_mensual:0, respuestas_mes:1000, precio_extra_1000:5, funciones:[], orden: D.planes.length + 1, activo:true, _nuevo:true }); rPla(); };
  document.querySelectorAll('[data-psave]').forEach(b => b.onclick = () => savePlan(+b.dataset.psave));
}
function planCard(p, i){
  const fn = p.funciones || [];
  return `<div class="card" id="pl${i}"><div class="row">
      <div><label>Código</label><input data-f="id" value="${esc(p.id)}" ${p._nuevo ? '' : 'readonly style="background:#f3f4f7"'} placeholder="ej.: emprendedor"></div>

      <div><label>Precio mensual ($)</label><input data-f="precio_mensual" type="number" step="0.01" value="${p.precio_mensual ?? ''}"></div>
      <div><label>Precio anual ($)</label><input data-f="precio_anual" type="number" step="0.01" value="${p.precio_anual ?? ''}"></div>
      <div><label>Respuestas al mes</label><input data-f="respuestas_mes" type="number" value="${p.respuestas_mes ?? ''}"></div>
      <div><label>$ por cada 1.000 extra</label><input data-f="precio_extra_1000" type="number" step="0.01" value="${p.precio_extra_1000 ?? ''}"></div>
      <div><label>Orden</label><input data-f="orden" type="number" value="${p.orden ?? 0}"></div>
    </div>
    <label>Descripción (la ve el cliente)</label><textarea data-f="descripcion" style="min-height:60px">${esc(p.descripcion || '')}</textarea>
    ${GRUPOS.map(([g, ks]) => `<label>${g}</label><div class="chks">${ks.map(k => `<label class="chk"><input type="checkbox" data-fn="${k}" ${fn.includes(k) ? 'checked' : ''}> ${FUNC[k]}</label>`).join('')}</div>`).join('')}
    <div class="chks" style="margin-top:10px"><label class="chk"><input type="checkbox" data-f="destacado" ${p.destacado ? 'checked' : ''}> ⭐ Plan destacado</label>
      <label class="chk"><input type="checkbox" data-f="activo" ${p.activo !== false ? 'checked' : ''}> Visible para clientes</label></div>
    ${fn.includes('masivos') ? '<div class="note warn">⚠️ Mensajes masivos: con la conexión que usamos, WhatsApp puede bloquear el número si se envía mucho. El sistema enviará despacio, con pausas variables y textos variados, y con un límite diario.</div>' : ''}
    <div style="margin-top:12px;text-align:right"><button class="btn" data-psave="${i}">Guardar plan</button></div></div>`;
}
async function savePlan(i){
  const el = $('pl' + i), p = {};
  el.querySelectorAll('[data-f]').forEach(x => p[x.dataset.f] = x.type === 'checkbox' ? x.checked : x.value);
  p.funciones = [...el.querySelectorAll('[data-fn]')].filter(x => x.checked).map(x => x.dataset.fn);
  if (!p.id || !p.nombre) return toast('Falta el código o el nombre');
  const r = await rpc('admin_guardar_plan', { p }).catch(() => null);
  if (r) { toast('Plan guardado'); load(); }
}

    </div>

    const r = await rpc('admin_guardar_ajustes', { p }).catch(() => null);

  };
}

start();
