<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotización</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{--bg:#eef1f0;--paper:#fff;--ink:#14201b;--muted:#5d6b64;--line:#dfe5e2;--brand:#0f7b5f;--soft:#e3f3ed;--warn:#9a6a00;--warn-soft:#fdf1d6;--bad:#b4372f;--bad-soft:#fbe5e3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
  .tools{max-width:820px;margin:0 auto;padding:16px;display:flex;justify-content:flex-end;gap:8px}
  .btn{border:0;background:var(--brand);color:#fff;font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer}
  .paper{max-width:820px;margin:0 auto 40px;background:var(--paper);border-radius:14px;padding:40px 44px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.05)}
  .top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:20px}
  .neg{display:flex;gap:14px;align-items:center;min-width:0}
  .neg img{max-height:64px;max-width:140px;object-fit:contain}
  .neg h1{font-size:20px;margin:0 0 2px}
  .neg p{margin:0;color:var(--muted);font-size:13px}
  .doc{text-align:right;flex:none}
  .doc .t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .doc .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}
  .meta div{background:#f7f9f8;border-radius:10px;padding:12px 14px}
  .meta small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
  td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  td.r,th.r{text-align:right;white-space:nowrap}
  td .v{color:var(--muted);font-size:12px}
  .pend{color:var(--warn);font-style:italic}
  .tot{margin-left:auto;width:min(320px,100%);margin-top:16px}
  .tot div{display:flex;justify-content:space-between;padding:6px 8px;font-variant-numeric:tabular-nums}
  .tot .g{border-top:2px solid var(--ink);font-size:18px;font-weight:700;margin-top:4px;padding-top:10px}
  .tot .bs{color:var(--muted);font-size:13px}
  .nota{margin-top:24px;color:var(--muted);font-size:13px;white-space:pre-wrap}
  .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-top:6px}
  .b-ok{background:var(--soft);color:var(--brand)} .b-w{background:var(--warn-soft);color:var(--warn)} .b-r{background:var(--bad-soft);color:var(--bad)}
  .foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}
  .msg{max-width:520px;margin:80px auto;text-align:center;color:var(--muted)}
  @media (max-width:600px){.paper{padding:22px 16px;border-radius:0}.top{flex-direction:column}.doc{text-align:left}.meta{grid-template-columns:1fr}
    th.hide,td.hide{display:none}}
  @media print{body{background:#fff}.tools{display:none}.paper{box-shadow:none;margin:0;max-width:none;padding:0}@page{margin:16mm}}
</style>
</head>
<body>
<div class="tools" id="tools" hidden><button class="btn" onclick="window.print()">⬇️ Descargar PDF / Imprimir</button></div>
<div id="out"><p class="msg">Cargando cotización…</p></div>
<script>
const CFG = window.PORTAL_CONFIG || {};
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = (n) => '$' + Number(n || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const bs = (n) => 'Bs ' + Number(n || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
(async () => {
  const q = new URLSearchParams(location.search), id = q.get('c'), k = q.get('k');
  const out = document.getElementById('out');
  if (!id || !k || !CFG.SUPABASE_URL) { out.innerHTML = '<p class="msg">Enlace de cotización no válido.</p>'; return; }
  const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const { data: d, error } = await sb.rpc('cotizacion_publica', { p_id: id, p_token: k });
  if (error || !d || !d.ok) { out.innerHTML = '<p class="msg">No encontramos esta cotización. Pide al negocio que te la envíe de nuevo.</p>'; return; }
  const N = d.negocio || {};
  document.title = 'Cotización ' + d.codigo + ' · ' + (N.nombre || '');
  const est = { por_completar: ['b-w', 'Precios por confirmar'], enviada: ['b-ok', 'Vigente'], aceptada: ['b-ok', 'Aceptada'], convertida: ['b-ok', 'Convertida en pedido'],
                vencida: ['b-r', 'Vencida'], rechazada: ['b-r', 'Rechazada'], anulada: ['b-r', 'Anulada'] }[d.estado] || ['b-ok', d.estado];
  const pct = Number(d.impuesto_pct || 0);
  out.innerHTML = `<div class="paper">
    <div class="top">
      <div class="neg">${N.logo_url ? `<img src="${esc(N.logo_url)}" alt="">` : ''}<div><h1>${esc(N.nombre)}</h1>
        ${N.direccion ? `<p>${esc(N.direccion)}</p>` : ''}<p>${[N.telefono ? '📱 +' + esc(String(N.telefono).replace(/^\+/, '')) : '', esc(N.email || '')].filter(Boolean).join(' · ')}</p></div></div>
      <div class="doc"><div class="t">Cotización</div><div class="n">${esc(d.codigo)}</div><span class="badge ${est[0]}">${est[1]}</span></div>
    </div>
    <div class="meta">
      <div><small>Cliente</small>${esc(d.cliente || '—')}${d.telefono_cliente ? `<br><span style="color:var(--muted)">+${esc(d.telefono_cliente)}</span>` : ''}</div>
      <div><small>Fecha · Válida hasta</small>${esc(d.fecha)}${d.valida_hasta ? ' · <b>' + esc(d.valida_hasta) + '</b>' : ''}</div>
    </div>
    <table>
      <thead><tr><th class="hide">#</th><th>Producto</th><th class="r">Cant.</th><th class="r">Precio unit.</th><th class="r">Total</th></tr></thead>
      <tbody>${(d.items || []).map(x => `<tr><td class="hide">${x.n}</td>
        <td>${esc(x.producto)}${x.variante ? `<div class="v">${esc(x.variante)}</div>` : ''}${x.nota ? `<div class="v">${esc(x.nota)}</div>` : ''}</td>
        <td class="r">${Number(x.cantidad).toLocaleString('es-VE')}</td>
        <td class="r">${x.precio == null ? '<span class="pend">por confirmar</span>' : usd(x.precio)}</td>
        <td class="r">${x.importe == null ? '—' : usd(x.importe)}</td></tr>`).join('')}</tbody>
    </table>
    <div class="tot">
      <div><span>Subtotal</span><span>${usd(d.subtotal)}</span></div>
      ${pct > 0 ? `<div><span>${esc(d.impuesto_nombre || 'Impuesto')} (${pct.toLocaleString('es-VE')}%)</span><span>${usd(d.impuesto)}</span></div>` : ''}
      <div class="g"><span>Total</span><span>${usd(d.total)}</span></div>
      ${d.tasa ? `<div class="bs"><span>Total en Bs (tasa ${bs(d.tasa)})</span><span>${bs(d.total_bs)}</span></div>` : ''}
    </div>
    ${d.faltan > 0 ? '<p class="nota pend">Algunos precios están por confirmar; el negocio te enviará la cotización completa.</p>' : ''}
    ${d.notas ? `<p class="nota">📝 ${esc(d.notas)}</p>` : ''}
    ${N.nota ? `<p class="nota">ℹ️ ${esc(N.nota)}</p>` : ''}
    <div class="foot">Para aceptar esta cotización responde <b>ACEPTO</b> en el chat de WhatsApp de ${esc(N.nombre)}.</div>
  </div>`;
  document.getElementById('tools').hidden = false;
})();
</script>
</body>
</html>
